name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Set tag identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: make release
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk '/^## / {print $2; exit}' CHANGELOG.md)
          notes="$RUNNER_TEMP/sdk-release-notes.md"
          awk '/^## / {if (section++) exit} section {print}' CHANGELOG.md > "$notes"
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --verify-tag --title "$version" --notes-file "$notes"
          fi
